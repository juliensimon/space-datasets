name: Update Ground Stations
on:
  schedule:
    - cron: '0 9 * * *'  # daily at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet] hf-dataset-utils
      - id: update
        run: python scripts/update-ground-stations.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Push cache and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ground-stations-cache.json
          git diff --cached --quiet || (git commit -m "cache: ground-stations $(date -u +%Y-%m-%d)" && git push origin main || true)
          bash scripts/push-status.sh ground-stations --rows ${{ steps.update.outputs.rows }}
