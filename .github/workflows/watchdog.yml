name: Watchdog
on:
  schedule:
    - cron: '0 21 * * *'  # 21:00 UTC, after all regular workflows
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/watchdog.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit status and retry state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/retry-state.json status.json
          git diff --cached --quiet || (git commit -m "watchdog: fix stale status $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
