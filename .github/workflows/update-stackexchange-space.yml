name: Update Stack Exchange Space Q&A
on:
  schedule:
    - cron: '0 17 1 1 *'  # annually, January 1 at 17:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet] py7zr beautifulsoup4
      - id: update
        run: python scripts/update-stackexchange-space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh stackexchange-space --rows ${{ steps.update.outputs.rows }}
