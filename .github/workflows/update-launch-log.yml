name: Update Launch Log
on:
  schedule:
    - cron: '0 7 * * 1'  # weekly, Monday at 07:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow huggingface_hub[hf_xet]
      - run: python scripts/update-launch-log.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
