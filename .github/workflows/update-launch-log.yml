name: Update Launch Log
on:
  schedule:
    - cron: '0 7 * * 1'  # weekly, Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow huggingface_hub[hf_xet]
      - run: python scripts/update-launch-log.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update status
        run: python scripts/update-status.py launch-log
      - name: Push status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "status: launch-log updated $(date -u +%Y-%m-%d)" && git push
