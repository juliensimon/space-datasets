name: Update Rocket Lab Launches
on:
  schedule:
    - cron: '15 9 * * *'  # daily at 09:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet]
      - id: update
        run: python scripts/update-rocket-lab-launches.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh rocket-lab-launches --rows ${{ steps.update.outputs.rows }}
