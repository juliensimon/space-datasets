name: Update IUE Observations
on:
  schedule:
    - cron: '30 15 1 1,4,7,10 *'  # quarterly, 1st of Jan/Apr/Jul/Oct at 15:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet]
      - id: update
        run: python scripts/update-iue.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh iue --rows ${{ steps.update.outputs.rows }}
