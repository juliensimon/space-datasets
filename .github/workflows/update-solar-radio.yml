name: Update Solar Radio
on:
  # schedule disabled: HEASARC solarburst table removed (2026-03)
  # schedule:
  #   - cron: '0 19 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet]
      - id: update
        run: python scripts/update-solar-radio.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh solar-radio --rows ${{ steps.update.outputs.rows }}
