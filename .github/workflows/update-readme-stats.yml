name: Update README Stats
on:
  schedule:
    - cron: '0 5 * * *'  # daily at 05:00 UTC (before other workflows)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub requests
      - run: python scripts/update-readme-stats.py
      - name: Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/download-stats.json
          git diff --cached --quiet || (git commit -m "stats: update top downloads $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
