name: Update TLE History
on:
  schedule:
    - cron: '0 14 * * *'  # daily at 14:00 UTC (after Space-Track publishes)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow requests huggingface_hub[hf_xet] pandas
      - id: update
        run: python scripts/update-tle-history.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
      - name: Update and push status
        run: bash scripts/push-status.sh tle-history --rows ${{ steps.update.outputs.rows }}
