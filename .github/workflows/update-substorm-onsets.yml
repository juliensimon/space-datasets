name: Update Substorm Onsets
on:
  schedule:
    - cron: '0 14 1 1,4,7,10 *'  # quarterly, 1st of Jan/Apr/Jul/Oct at 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet]
      - id: update
        run: python scripts/update-substorm-onsets.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh substorm-onsets --rows ${{ steps.update.outputs.rows }}
