name: Update AST SpaceMobile Fleet
on:
  schedule:
    - cron: '15 9 * * *'  # daily at 09:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet]
      - id: update
        run: python scripts/update-ast-spacemobile.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh ast-spacemobile --rows ${{ steps.update.outputs.rows }}
