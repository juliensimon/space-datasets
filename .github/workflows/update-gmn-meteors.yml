name: Update Global Meteor Network
on:
  schedule:
    - cron: '0 10 * * *'  # daily at 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet] hf-dataset-utils beautifulsoup4
      - id: update
        run: python scripts/update-gmn-meteors.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh gmn-meteors --rows ${{ steps.update.outputs.rows }}
