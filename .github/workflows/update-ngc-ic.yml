name: Update NGC IC Catalog
on:
  schedule:
    - cron: '30 18 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests beautifulsoup4 lxml huggingface_hub[hf_xet]
      - id: update
        run: python scripts/update-ngc-ic.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh ngc-ic --rows ${{ steps.update.outputs.rows }}
