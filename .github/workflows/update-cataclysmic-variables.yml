name: Update Cataclysmic Variables
on:
  schedule:
    - cron: '30 8 1 2,5,8,11 *'  # quarterly, Feb/May/Aug/Nov 1st at 08:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet] git+https://github.com/juliensimon/hf-dataset-utils.git
      - id: update
        run: python scripts/update-cataclysmic-variables.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh cataclysmic-variables --rows ${{ steps.update.outputs.rows }}
