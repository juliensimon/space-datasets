name: Update MAVEN
on:
  schedule:
    - cron: '30 10 1 */3 *'  # Quarterly (1st of Jan/Apr/Jul/Oct)
  workflow_dispatch:
    inputs:
      year:
        description: 'Fetch a single year (e.g. 2020). Leave empty for incremental.'
        required: false
        type: string
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet] hf-dataset-utils
      - id: update
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            python scripts/update-maven.py --year ${{ github.event.inputs.year }}
          else
            python scripts/update-maven.py
          fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase || true
            git checkout status.json 2>/dev/null || true
            python scripts/update-status.py maven --rows ${{ steps.update.outputs.rows }}
            git add status.json
            git diff --cached --quiet && break
            git commit -m "status: maven updated $(date -u +%Y-%m-%d)"
            git push && break
            echo "Push failed (attempt $i), retrying..."
            git reset HEAD~1
            sleep 2
          done
