name: Update Fermi GBM Triggers
on:
  schedule:
    - cron: '0 20 * * *'  # daily at 20:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet]
      - id: update
        run: python scripts/update-fermi-gbm-triggers.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh fermi-gbm-triggers --rows ${{ steps.update.outputs.rows }}
