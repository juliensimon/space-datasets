name: Update Gamma-Ray Bursts
on:
  schedule:
    - cron: '0 17 * * 1'  # weekly Mon at 17:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet] hf-dataset-utils
      - id: update
        run: python scripts/update-grb.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh grb --rows ${{ steps.update.outputs.rows }}
