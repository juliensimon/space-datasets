name: Update CRDB
on:
  schedule:
    - cron: '0 6 1 */3 *'  # quarterly: 1st of Jan/Apr/Jul/Oct at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment: HF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests huggingface_hub[hf_xet] crdb
      - id: update
        run: python scripts/update-crdb.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Update and push status
        run: bash scripts/push-status.sh crdb --rows ${{ steps.update.outputs.rows }}
